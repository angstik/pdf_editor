<!DOCTYPE html>
<html lang="fr" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EDITION PDF — multi</title>
<meta name="description" content="Édition de PDF hors ligne : signatures, images et textes posés sur vos documents, sans envoi de fichier.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'">
<meta name="theme-color" content="#1f2230" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EDITION PDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script src="theme-boot.js"></script>
</head>
<body>

<header>
  <button id="btnLib" class="icon glyph-lg" data-i18n-title="nav.library" aria-label="">☰</button>
  <span class="brand hide-sm">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 17c3.5 0 4-11 7.5-11S13 15 15.5 15c1.2 0 2-1 2.5-1.7"/><path d="M3 21h18"/></svg>
    EDITION PDF
  </span>
  <span class="sep hide-sm"></span>
  <button id="btnOpen" class="primary hide-sm" data-i18n="nav.open" data-i18n-title="nav.openAny"></button>
  <button id="btnOpenSm" class="icon only-sm primary" data-i18n-title="nav.openAny" aria-label="">📂</button>
  <span class="docname" id="docName"></span>
  <button id="btnClose" class="icon ghost" data-i18n-title="nav.closeDoc" aria-label="" hidden>✕</button>
  <span class="spacer"></span>
  <button id="btnAnn" class="icon ghost rel" data-i18n-title="ann.title" aria-label="">⇄<span class="dot"></span></button>
  <button id="btnClip" class="icon ghost" data-i18n-title="insp.clip" aria-label="">📋</button>
  <button id="btnExport" class="primary hide-sm" data-i18n="nav.save"></button>
  <button id="btnExportSm" class="icon only-sm primary" data-i18n-title="nav.save" aria-label="">⬇</button>
  <button id="btnInsp" class="icon rel" data-i18n-title="nav.properties" aria-label="">⚙<span class="dot"></span></button>
</header>

<div class="toolbar">
  <span class="grp" id="grpNav">
    <button id="pPrev" class="icon glyph-lg" data-i18n-title="tool.prev" aria-label="">‹</button>
    <input type="text" id="pNum" value="–" inputmode="numeric" maxlength="4" data-i18n-title="tool.pageNumber" aria-label="">
    <span class="tot" id="pTot">/ –</span>
    <button id="pNext" class="icon glyph-lg" data-i18n-title="tool.next" aria-label="">›</button>
    <span class="sep hide-sm"></span>
    <button id="zOut" class="icon glyph-lg hide-sm" data-i18n-title="tool.zoomOut" aria-label="">−</button>
    <span class="zlbl hide-sm" id="zLbl">100%</span>
    <button id="zIn" class="icon glyph-lg hide-sm" data-i18n-title="tool.zoomIn" aria-label="">+</button>
    <button id="zFit" class="ghost hide-sm" data-i18n="tool.fit"></button>
    <button id="zFitSm" class="icon only-sm ghost" data-i18n-title="tool.fitLong" aria-label="">⤢</button>
  </span>
  <span class="spacer"></span>
  <span class="grp" id="grpHist">
    <button id="btnUndo" class="icon glyph-lg" data-i18n-title="tool.undo" aria-label="">↶</button>
    <button id="btnRedo" class="icon glyph-lg" data-i18n-title="tool.redo" aria-label="">↷</button>
  </span>
  <span class="sep" id="sepTools"></span>
  <span class="grp" id="grpAdd">
    <button id="btnText" class="icon" data-i18n-title="tool.addText" aria-label="">T</button>
    <button id="btnHl" class="icon glyph-lg ghost" data-i18n-title="tool.highlight" aria-label="">▧</button>
    <button id="btnCmt" class="icon ghost" data-i18n-title="tool.comment" aria-label="">✎</button>
  </span>
</div>

<main>
  <aside class="left" id="paneLib">
    <div class="pane-head">
      <h2 data-i18n="nav.library"></h2>
      <button id="btnLibIO" class="icon ghost" data-i18n-title="nav.libIO" aria-label="">⇅</button>
      <button id="btnWipe" class="icon ghost" data-i18n-title="lib.wipe" aria-label="">🧹</button>
      <button id="btnVault" class="icon ghost" data-i18n-title="lib.protect" aria-label="">🔒</button>
      <button id="closeLib" class="icon ghost" data-i18n-title="nav.close" aria-label="">✕</button>
    </div>
    <div class="pane-body" id="libBody"><div class="empty" data-i18n="lib.loading"></div></div>
    <div class="pane-foot">
      <button id="btnImport" style="flex:1" data-i18n="lib.import"></button>
      <button id="btnDraw" style="flex:1" data-i18n="lib.draw"></button>
    </div>
  </aside>

  <section class="viewer" id="viewer">
    <div class="drophint" id="hint">
      <b data-i18n="drop.title"></b>
      <span data-i18n="drop.body"></span>
      <span data-i18n="drop.privacy"></span>
    </div>
    <div class="stage" id="stage" hidden>
      <canvas id="cv"></canvas>
      <div class="layer" id="layer"></div>
    </div>
  </section>

  <aside class="right" id="paneInsp">
    <div class="pane-head">
      <h2 data-i18n="nav.properties"></h2>
      <span class="ver" id="appVer"></span>
      <span class="spacer"></span>
      <button id="btnSet" class="icon ghost" data-i18n-title="insp.settings" aria-label="">⚙</button>
      <button id="btnLangP" class="icon ghost" data-i18n-title="nav.language" aria-label="">🌐</button>
      <button id="closeInsp" class="icon ghost" data-i18n-title="nav.close" aria-label="">✕</button>
    </div>
    <div class="pane-body" id="insp"></div>
    <div class="pane-foot" style="flex-direction:column;gap:6px;align-items:stretch">
      <div class="chip" data-i18n="insp.items"></div>
      <div class="list" id="itemList"></div>
    </div>
  </aside>
</main>

<!-- Saisie flottante : panneau non modal, le document reste manipulable derrière -->
<!-- Saisie flottante : panneau non modal, sans aucun champ de formulaire.
     iOS impose sa barre d'accessoires dès qu'un input ou un textarea existe et
     prend le focus ; ici tout est bouton ou élément éditable. -->
<div id="composer" hidden>
  <div class="cp-row">
    <button id="cpCol" class="cp-sw" tabindex="-1" aria-label=""><i></i></button>
    <button id="cpShot" class="cp-chk" tabindex="-1" aria-pressed="false">
<span class="box">✓</span><span id="cpShotLbl"></span></button>
    <span class="spacer"></span>
    <button id="cpClr" class="icon" tabindex="-1">⌫</button>
    <button id="cpSet" class="icon" tabindex="-1">⚙</button>
    <button id="cpNo" class="icon" tabindex="-1">❌</button>
    <button id="cpOk" class="icon" tabindex="-1">✅</button>
  </div>
  <div id="cpTxt" class="edit" contenteditable="plaintext-only" role="textbox" aria-multiline="true"></div>
  <div id="cpPal" class="cp-pal" hidden></div>
</div>
<div id="scrim"></div>
<div class="mask" id="mask"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="measure" aria-hidden="true"></div>

<input type="file" id="filePdf" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileLib" accept=".pdfedlib,.json,application/json" hidden>
<input type="file" id="fileAnn" accept=".json,application/json" multiple hidden>

<script src="../vendor/pdf.min.js"></script>
<script src="../vendor/pdf-lib.min.js"></script>
<script src="../vendor/fontkit.umd.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
