# Publication du site sur GitHub Pages à chaque push sur main.
#
# Prérequis : Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Alternative sans workflow : Source = "Deploy from a branch" (main / root) ;
# dans ce cas, supprimez ce fichier. Le fichier .nojekyll reste nécessaire pour
# que Jekyll ne retraite pas le contenu.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Le dépôt est publié tel quel : pas d'étape de build.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
